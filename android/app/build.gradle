// The backend configuration is the single maintained source for both modes.
def syncGuideChannels = tasks.register('syncGuideChannels', Sync) {
    from(rootProject.file('../tvguide-api/config/channels.json'))
    into(layout.buildDirectory.dir('generated/guideAssets'))
}
tasks.named('preBuild').configure { dependsOn(syncGuideChannels) }
