apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'

// Signing-gegevens komen uit android/keystore.properties, dat buiten versiebeheer
// blijft. Ontbreekt dat bestand (bijv. op een schone checkout of CI zonder secrets),
// dan valt de release-build terug op niet-ondertekend in plaats van te falen.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseSigning = file(keystoreProperties['storeFile'] as String).exists()
    if (!hasReleaseSigning) {
        logger.warn("keystore.properties gevonden, maar storeFile ontbreekt: ${keystoreProperties['storeFile']}")
    }
}

android {
    namespace "com.nexustvguide.app"

    defaultConfig {
        applicationId "com.nexustvguide.app"
        minSdk 21
        targetSdk 34
        compileSdk 34
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "DEFAULT_BASE_URL", "\"http://192.168.2.171:3000/\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
                // v1+v2 zijn nodig voor minSdk 21; v3 geeft extra
                // integriteitsbescherming op Android 9+ (o.a. de Shield).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation project(":library")

    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // AndroidX & Leanback
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    // Networking: Retrofit & OkHttp
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // Date & Time
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.7'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'androidx.test:core-ktx:1.6.1'
    testImplementation 'androidx.test.ext:junit:1.2.1'
}
