apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlin-kapt'

def versionPropertiesFile = rootProject.file("app/version.properties")

def loadAppVersion = {
    if (!versionPropertiesFile.exists()) {
        throw new GradleException("Ontbrekend versiebestand: ${versionPropertiesFile}")
    }

    def properties = new Properties()
    versionPropertiesFile.withInputStream { properties.load(it) }

    def rawVersionCode = properties.getProperty("VERSION_CODE")?.trim()
    def versionName = properties.getProperty("VERSION_NAME")?.trim()
    if (!rawVersionCode?.isInteger() || rawVersionCode.toInteger() <= 0) {
        throw new GradleException("VERSION_CODE moet een positief geheel getal zijn")
    }
    if (!(versionName ==~ /^\d+\.\d+\.\d+$/)) {
        throw new GradleException("VERSION_NAME moet de vorm x.x.x hebben")
    }

    [code: rawVersionCode.toInteger(), name: versionName]
}

def parseSemanticVersion = { String versionName ->
    def matcher = versionName =~ /^(\d+)\.(\d+)\.(\d+)$/
    if (!matcher.matches()) {
        throw new GradleException("VERSION_NAME moet de vorm x.x.x hebben")
    }
    [major: matcher.group(1).toInteger(), minor: matcher.group(2).toInteger(), patch: matcher.group(3).toInteger()]
}

/**
 * Updatekanaal-configuratie.
 *
 * De app haalt gidsdata standaalone op, maar nieuwe APK-versies moeten van ergens komen.
 * Twee kanalen worden ondersteund:
 *
 *  - "lan"     : de bestaande tvguide-api op het LAN (http, relatief downloadPath).
 *  - "release" : een release-host zoals GitHub/Forgejo die een statisch version.json
 *                publiceert met een absolute downloadUrl naar het APK-asset.
 *
 * Overrulen kan via gradle.properties of de command line:
 *   ./gradlew :app:assembleRelease -PupdateChannel=release \
 *       -PupdateBaseUrl=https://github.com/<user>/<repo>/releases/latest/download/
 */
def resolveUpdateChannel = {
    def channel = (project.findProperty("updateChannel") ?: "lan").toString().trim()

    def defaults = [
        lan: [
            baseUrl      : "http://192.168.2.171:3000/",
            manifestPath : "api/v1/app/version",
            // Leeg: de LAN-backend levert het asset op zijn eigen origin, die altijd
            // is toegestaan. Een allowlist is daar dus niet nodig.
            hostAllowlist: ""
        ],
        release: [
            // Vul in met de eigen release-host, bijv.
            // https://github.com/<user>/NexusTVGuide/releases/latest/download/
            baseUrl      : "https://example.invalid/",
            manifestPath : "version.json",
            // GitHub serveert version.json vanaf github.com en leidt het APK-asset door
            // naar een asset-host: objects.githubusercontent.com (ouder) of
            // release-assets.githubusercontent.com (huidig). Alle drie zijn nodig.
            hostAllowlist: "github.com,objects.githubusercontent.com,release-assets.githubusercontent.com"
        ]
    ]

    def selected = defaults[channel]
    if (selected == null) {
        throw new GradleException("Onbekend updateChannel '${channel}'; kies 'lan' of 'release'")
    }

    def baseUrl = (project.findProperty("updateBaseUrl") ?: selected.baseUrl).toString().trim()
    def manifestPath = (project.findProperty("updateManifestPath") ?: selected.manifestPath).toString().trim()
    def hostAllowlist = (project.findProperty("updateHostAllowlist") ?: selected.hostAllowlist).toString().trim()

    if (!baseUrl.endsWith("/")) {
        // Retrofit vereist een base-URL met sluitende slash, anders valt het laatste segment weg.
        throw new GradleException("updateBaseUrl moet op '/' eindigen, ontvangen: '${baseUrl}'")
    }
    if (!(baseUrl.startsWith("http://") || baseUrl.startsWith("https://"))) {
        throw new GradleException("updateBaseUrl moet met http:// of https:// beginnen, ontvangen: '${baseUrl}'")
    }
    if (channel == "release" && baseUrl.startsWith("http://")) {
        throw new GradleException("Een release-updatekanaal moet HTTPS gebruiken, ontvangen: '${baseUrl}'")
    }
    if (channel == "release" && baseUrl.contains("example.invalid")) {
        throw new GradleException(
            "Het release-updatekanaal heeft nog geen host. Geef -PupdateBaseUrl=<url> mee " +
            "of zet updateBaseUrl in gradle.properties."
        )
    }
    if (manifestPath.startsWith("/")) {
        // Een leidende slash zou de base-URL-padcomponent wegvagen bij het resolven.
        throw new GradleException("updateManifestPath moet relatief zijn (zonder leidende '/'), ontvangen: '${manifestPath}'")
    }

    [baseUrl: baseUrl, manifestPath: manifestPath, hostAllowlist: hostAllowlist, channel: channel]
}

def updateChannel = resolveUpdateChannel()
logger.lifecycle("Updatekanaal: ${updateChannel.channel} -> ${updateChannel.baseUrl}${updateChannel.manifestPath}")

def appVersion = loadAppVersion()

// Signing-gegevens komen uit android/keystore.properties, dat buiten versiebeheer
// blijft. Ontbreekt dat bestand (bijv. op een schone checkout of CI zonder secrets),
// dan valt de release-build terug op niet-ondertekend in plaats van te falen.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseSigning = false
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
    hasReleaseSigning = file(keystoreProperties['storeFile'] as String).exists()
    if (!hasReleaseSigning) {
        logger.warn("keystore.properties gevonden, maar storeFile ontbreekt: ${keystoreProperties['storeFile']}")
    }
}

android {
    namespace "com.nexustvguide.app"

    defaultConfig {
        applicationId "com.nexustvguide.app"
        minSdk 21
        targetSdk 34
        compileSdk 34
        versionCode appVersion.code
        versionName appVersion.name

        buildConfigField "String", "DEFAULT_BASE_URL", "\"http://192.168.2.171:3000/\""
        buildConfigField "String", "GUIDE_SOURCE", "\"LOCAL\""

        // Updatekanaal. Zie gradle.properties voor de instelbare waarden en
        // docs/plan-2026-08-31-standalone-android.md §7.6 voor de achtergrond.
        buildConfigField "String", "UPDATE_BASE_URL", "\"${updateChannel.baseUrl}\""
        buildConfigField "String", "UPDATE_MANIFEST_PATH", "\"${updateChannel.manifestPath}\""
        buildConfigField "String", "UPDATE_HOST_ALLOWLIST", "\"${updateChannel.hostAllowlist}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir("generated/guideAssets"))

    buildFeatures {
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(keystoreProperties['storeFile'] as String)
                storePassword keystoreProperties['storePassword'] as String
                keyAlias keystoreProperties['keyAlias'] as String
                keyPassword keystoreProperties['keyPassword'] as String
                // v1+v2 zijn nodig voor minSdk 21; v3 geeft extra
                // integriteitsbescherming op Android 9+ (o.a. de Shield).
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "NexusTVGuide-v${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

// Een debug-APK krijgt de versie uit version.properties. Na een geslaagde packaging
// wordt dat bestand naar de volgende patchversie geschreven, klaar voor de volgende
// debug-build. Daardoor verbruiken unit tests en mislukte builds geen versienummer.
def bumpDebugVersion = {
    def currentVersion = loadAppVersion()
    def semanticVersion = parseSemanticVersion(currentVersion.name)
    def nextVersionCode = Math.addExact(currentVersion.code, 1)
    def nextPatch = Math.addExact(semanticVersion.patch, 1)
    def nextVersionName = "${semanticVersion.major}.${semanticVersion.minor}.${nextPatch}"

    versionPropertiesFile.setText(
        "VERSION_CODE=${nextVersionCode}\nVERSION_NAME=${nextVersionName}\n",
        "UTF-8"
    )
    logger.lifecycle("Debug-APK gebouwd als ${currentVersion.name} (${currentVersion.code}); volgende versie: ${nextVersionName} (${nextVersionCode})")
}

tasks.configureEach { task ->
    // BuildConfig.VERSION_CODE en VERSION_NAME worden door Kotlin ingevoegd als
    // constanten. Maak het versiebestand daarom een expliciete buildinput, zodat
    // deze klassen bij elke bump opnieuw worden gecompileerd.
    if (task.name.startsWith("compile") && task.name.endsWith("Kotlin")) {
        task.inputs.file(versionPropertiesFile)
    }

    if (task.name == "packageDebug" || task.name == "packageDebugBundle") {
        task.doLast(bumpDebugVersion)
    }
}


kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
    }
}

