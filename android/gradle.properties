# --- Updatekanaal -----------------------------------------------------------
# Bepaalt waar de app naar nieuwe APK-versies zoekt. Gidsdata staan hier los van:
# die haalt de app in LOCAL-modus rechtstreeks bij de bron op.
#
#   updateChannel=lan      (standaard) tvguide-api op het LAN; http, relatief downloadPath.
#   updateChannel=release  Release-host (GitHub/Forgejo) met een statisch version.json
#                          en een absolute downloadUrl naar het APK-asset.
#
# Het release-kanaal vereist een expliciete host; er is bewust geen default, zodat een
# build nooit stilzwijgend naar een verkeerde bron wijst:
#
#   updateChannel=release
#   updateBaseUrl=https://github.com/<user>/NexusTVGuide/releases/latest/download/
#
# Optioneel te overrulen:
#   updateManifestPath=version.json
#   updateHostAllowlist=github.com,objects.githubusercontent.com
#
# Alles kan ook per build meegegeven worden, bijv.:
#   ./gradlew :app:assembleRelease -PupdateChannel=release -PupdateBaseUrl=https://...
